name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild the dashboard from template and data
        run: python3 tools/build.py

      - name: Fail if web/index.html is out of date
        run: |
          if ! git diff --quiet -- web/index.html; then
            echo "web/index.html does not match tools/. Run: python3 tools/build.py"
            git diff --stat -- web/index.html
            exit 1
          fi
          echo "web/index.html is in sync with tools/"
